name: Code Quality

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/code-quality.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: license-system

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # clang-format — enforce consistent code style
  # ────────────────────────────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find common client server tests \
            -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
          | sort | xargs clang-format-18 --dry-run --Werror
          echo "All files are correctly formatted."

  # ────────────────────────────────────────────────────────────────────────────
  # cppcheck — lightweight static analysis (zero false-positive config)
  # ────────────────────────────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Install dependencies (for cppcheck include paths)
        run: |
          sudo apt-get install -y libssl-dev libargon2-dev

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I common/include \
            -I client/include \
            -I /usr/include/openssl \
            --template='{file}:{line}: {severity}: [{id}] {message}' \
            common/src client/src server/src 2>&1 | tee cppcheck-report.txt
          echo "cppcheck passed."

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: license-system/cppcheck-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # clang-tidy — in-depth linting with compile commands
  # ────────────────────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang-18 clang-tidy-18 cmake ninja-build \
            libssl-dev libargon2-dev libtss2-dev pkg-config

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON
        env:
          CC: clang-18
          CXX: clang++-18

      - name: Run clang-tidy
        run: |
          # Collect all project source files (exclude FetchContent/external).
          find common/src client/src server/src \
            -name '*.cpp' \
          | sort > sources.txt

          clang-tidy-18 \
            -p build \
            --config-file=../.clang-tidy \
            --warnings-as-errors='clang-analyzer-security.*,bugprone-use-after-move' \
            $(cat sources.txt) 2>&1 | tee clang-tidy-report.txt

          # Fail if any errors/warnings were emitted.
          if grep -qE '^.*: (error|warning):' clang-tidy-report.txt; then
            echo "clang-tidy found issues — see report above."
            exit 1
          fi
          echo "clang-tidy passed."

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: license-system/clang-tidy-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # cmake-lint — validate CMakeLists.txt syntax and style
  # ────────────────────────────────────────────────────────────────────────────
  cmake-lint:
    name: cmake-lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake-lint
        run: pip install cmakelang

      - name: Lint CMakeLists.txt files
        run: |
          find . -name CMakeLists.txt | sort | xargs cmake-lint \
            --disabled-codes C0103 \
            2>&1 | tee cmake-lint-report.txt || true
          # Report but don't fail (cmake-lint is advisory for now).
          echo "cmake-lint complete."

  # ────────────────────────────────────────────────────────────────────────────
  # include-guard — ensure all headers have proper #pragma once
  # ────────────────────────────────────────────────────────────────────────────
  include-guard:
    name: Header include-guards
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check #pragma once in all headers
        run: |
          missing=""
          while IFS= read -r -d '' f; do
            if ! head -5 "$f" | grep -q '#pragma once'; then
              missing="$missing\n  $f"
            fi
          done < <(find common/include client/include -name '*.h' -print0)

          if [ -n "$missing" ]; then
            echo "Headers missing #pragma once:$missing"
            exit 1
          fi
          echo "All headers have #pragma once."

  # ────────────────────────────────────────────────────────────────────────────
  # dependency-review — flag newly added vulnerable deps on PRs
  # ────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
