name: Code Quality

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/code-quality.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# All jobs share a "Detect source root" step (id: src) that sets
# steps.src.outputs.root to either $GITHUB_WORKSPACE/license-system (monorepo)
# or $GITHUB_WORKSPACE (standalone repo where CMakeLists.txt is at root).
# Every subsequent working-directory uses ${{ steps.src.outputs.root }}.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # clang-format — enforce consistent code style
  # ────────────────────────────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install clang-format
        run: |
          sudo apt-get update -q
          # Pin to clang-format-12 — files in this repo are formatted with 12.
          # Upgrading clang-format later requires re-running clang-format -i on
          # all source files and committing the result.
          sudo apt-get install -y --no-install-recommends clang-format-12

      - name: Check formatting
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          mapfile -t files < <(find common client server tests \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C++ source files found."
            exit 1
          fi

          echo "Checking ${#files[@]} files..."
          clang-format-12 --dry-run --Werror "${files[@]}"
          echo "All files are correctly formatted."

  # ────────────────────────────────────────────────────────────────────────────
  # cppcheck — lightweight static analysis
  # ────────────────────────────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cppcheck libssl-dev libargon2-dev pkg-config

      - name: Run cppcheck
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I common/include \
            -I client/include \
            --template='{file}:{line}: {severity}: [{id}] {message}' \
            common/src client/src server/src \
            2>&1 | tee cppcheck-report.txt
          echo "cppcheck passed."

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: ${{ steps.src.outputs.root }}/cppcheck-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # clang-tidy — in-depth linting with full compile information
  # ────────────────────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            clang clang-tidy \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure (generate compile_commands.json)
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON

      - name: Run clang-tidy
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          mapfile -t sources < <(find common/src client/src server/src \
            -name '*.cpp' | sort)

          echo "Running clang-tidy on ${#sources[@]} files..."

          clang-tidy \
            -p build \
            --config-file="$GITHUB_WORKSPACE/.clang-tidy" \
            "${sources[@]}" \
            2>&1 | tee clang-tidy-report.txt

          if grep -qE ': (error|warning):' clang-tidy-report.txt; then
            echo "clang-tidy found issues."
            exit 1
          fi
          echo "clang-tidy passed."

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: ${{ steps.src.outputs.root }}/clang-tidy-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # cmake-lint — validate CMakeLists.txt (advisory, does not fail the build)
  # ────────────────────────────────────────────────────────────────────────────
  cmake-lint:
    name: cmake-lint (advisory)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cmake-lint
        run: pip install --quiet cmakelang

      - name: Lint CMakeLists files
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          mapfile -t cmake_files < <(find . -name CMakeLists.txt | sort)
          echo "Linting ${#cmake_files[@]} CMakeLists files..."
          cmake-lint "${cmake_files[@]}" \
            --disabled-codes C0103 C0301 \
            2>&1 | tee cmake-lint-report.txt || true
          echo "cmake-lint complete (advisory)."

      - name: Upload cmake-lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-lint-report
          path: ${{ steps.src.outputs.root }}/cmake-lint-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # include-guard — all headers must have #pragma once
  # ────────────────────────────────────────────────────────────────────────────
  include-guard:
    name: Header include-guards
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Check #pragma once
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          missing=()
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -q '#pragma once'; then
              missing+=("$f")
            fi
          done < <(find common/include client/include \
            \( -name '*.h' -o -name '*.hpp' \) | sort)

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Headers missing #pragma once:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All headers have #pragma once."

  # dependency-review is omitted: it requires GitHub's Dependency Graph feature,
  # which does not support CMake projects. The action always fails on C++ repos.
