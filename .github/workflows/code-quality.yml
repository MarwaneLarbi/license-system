name: Code Quality

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/code-quality.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # clang-format — enforce consistent code style
  # ────────────────────────────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        working-directory: license-system
        run: |
          # Find all C++ source and header files.
          # Group the -name alternatives with \( \) so -o applies correctly.
          mapfile -t files < <(find common client server tests \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C++ source files found."
            exit 1
          fi

          echo "Checking ${#files[@]} files..."
          clang-format --dry-run --Werror "${files[@]}"
          echo "All files are correctly formatted."

  # ────────────────────────────────────────────────────────────────────────────
  # cppcheck — lightweight static analysis
  # ────────────────────────────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cppcheck libssl-dev libargon2-dev pkg-config

      - name: Run cppcheck
        working-directory: license-system
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I common/include \
            -I client/include \
            --template='{file}:{line}: {severity}: [{id}] {message}' \
            common/src client/src server/src \
            2>&1 | tee cppcheck-report.txt
          echo "cppcheck passed."

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: license-system/cppcheck-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # clang-tidy — in-depth linting with full compile information
  # ────────────────────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            clang clang-tidy \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure (generate compile_commands.json)
        working-directory: license-system
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON

      - name: Run clang-tidy
        working-directory: license-system
        run: |
          # Collect project source files only (exclude FetchContent/_deps).
          mapfile -t sources < <(find common/src client/src server/src \
            -name '*.cpp' | sort)

          echo "Running clang-tidy on ${#sources[@]} files..."

          clang-tidy \
            -p build \
            --config-file=../.clang-tidy \
            "${sources[@]}" \
            2>&1 | tee clang-tidy-report.txt

          # Fail if errors were found.
          if grep -qE ': (error|warning):' clang-tidy-report.txt; then
            echo "clang-tidy found issues."
            exit 1
          fi
          echo "clang-tidy passed."

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: license-system/clang-tidy-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # cmake-lint — validate CMakeLists.txt (advisory, does not fail the build)
  # ────────────────────────────────────────────────────────────────────────────
  cmake-lint:
    name: cmake-lint (advisory)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake-lint
        run: pip install --quiet cmakelang

      - name: Lint CMakeLists files
        working-directory: license-system
        run: |
          mapfile -t cmake_files < <(find . -name CMakeLists.txt | sort)
          echo "Linting ${#cmake_files[@]} CMakeLists files..."
          cmake-lint "${cmake_files[@]}" \
            --disabled-codes C0103 C0301 \
            2>&1 | tee cmake-lint-report.txt || true
          echo "cmake-lint complete (advisory)."

  # ────────────────────────────────────────────────────────────────────────────
  # include-guard — all headers must have #pragma once
  # ────────────────────────────────────────────────────────────────────────────
  include-guard:
    name: Header include-guards
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check #pragma once
        working-directory: license-system
        run: |
          missing=()
          while IFS= read -r -d '' f; do
            if ! head -5 "$f" | grep -q '#pragma once'; then
              missing+=("$f")
            fi
          done < <(find common/include client/include \
            -name '*.h' -o -name '*.hpp' | sort | tr '\n' '\0')

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Headers missing #pragma once:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All headers have #pragma once."

  # ────────────────────────────────────────────────────────────────────────────
  # dependency-review — flag newly added vulnerable deps (PRs only)
  # ────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
