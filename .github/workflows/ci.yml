name: CI — Build & Test

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: license-system

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Linux — GCC (Release)
  # ────────────────────────────────────────────────────────────────────────────
  build-test-linux-gcc:
    name: Linux / GCC / Release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-gcc
          path: license-system/build/Testing/

  # ────────────────────────────────────────────────────────────────────────────
  # Linux — Clang (Release)
  # ────────────────────────────────────────────────────────────────────────────
  build-test-linux-clang:
    name: Linux / Clang / Release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ────────────────────────────────────────────────────────────────────────────
  # Windows — MSVC (Release)
  # ────────────────────────────────────────────────────────────────────────────
  build-test-windows:
    name: Windows / MSVC / Release
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install OpenSSL via Chocolatey
        run: choco install openssl --no-progress -y
        shell: pwsh

      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64" `
            -DLICENSE_BUILD_TESTS=ON `
            -DLICENSE_ENABLE_TPM=ON
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4
        shell: pwsh

  # ────────────────────────────────────────────────────────────────────────────
  # macOS — Apple Silicon / arm64 (Release)
  # ────────────────────────────────────────────────────────────────────────────
  build-test-macos-arm64:
    name: macOS / arm64 / Release
    runs-on: macos-latest   # macos-14 — Apple M1

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja openssl@3 argon2 pkg-config

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ────────────────────────────────────────────────────────────────────────────
  # macOS — Intel / x86_64 (Release)
  # ────────────────────────────────────────────────────────────────────────────
  build-test-macos-x64:
    name: macOS / x86_64 / Release
    runs-on: macos-13        # Intel runner

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja openssl@3 argon2 pkg-config

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ────────────────────────────────────────────────────────────────────────────
  # Linux — ARM64 (Release)
  # ────────────────────────────────────────────────────────────────────────────
  build-test-linux-arm64:
    name: Linux / ARM64 / Release
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # ────────────────────────────────────────────────────────────────────────────
  # Summary gate — all jobs must pass for PR merge
  # ────────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI — All Passed
    needs:
      - build-test-linux-gcc
      - build-test-linux-clang
      - build-test-windows
      - build-test-macos-arm64
      - build-test-macos-x64
      - build-test-linux-arm64
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          failed = [k for k,v in d.items() if v['result'] not in ('success','skipped')]
          print('\n'.join(failed))
          ")
          if [ -n "$failed" ]; then
            echo "Failed jobs:" && echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed."
