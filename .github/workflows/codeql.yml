name: CodeQL Security Analysis

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
  schedule:
    # Weekly scan — every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # CodeQL C++ analysis
  # Detects: buffer overflows, injection, use-after-free, cryptography misuse,
  #          format-string bugs, integer overflows, and more.
  # ────────────────────────────────────────────────────────────────────────────
  analyze-cpp:
    name: CodeQL — C++
    runs-on: ubuntu-24.04

    permissions:
      actions:         read
      contents:        read
      security-events: write   # Required to upload SARIF results

    steps:
      - uses: actions/checkout@v4

      # Detect whether source lives in license-system/ subdirectory or at root.
      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
            echo "prefix=license-system/" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "prefix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          # Use the security-extended query suite for a comprehensive scan.
          queries: security-extended,security-and-quality
          config: |
            paths:
              - ${{ steps.src.outputs.prefix }}common
              - ${{ steps.src.outputs.prefix }}client
              - ${{ steps.src.outputs.prefix }}server
            paths-ignore:
              - ${{ steps.src.outputs.prefix }}build
              - '**/_deps/**'

      # Build the project so CodeQL can trace the compilation.
      - name: Build for CodeQL tracing
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=ON
          cmake --build build --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
          upload: true
          output: sarif-results

      - name: Upload SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results/
