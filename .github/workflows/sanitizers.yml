name: Sanitizers

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/sanitizers.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/sanitizers.yml'
  schedule:
    # Nightly at 03:00 UTC on the default branch.
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # AddressSanitizer + UndefinedBehaviourSanitizer — GCC
  # ────────────────────────────────────────────────────────────────────────────
  asan-ubsan-gcc:
    name: ASan + UBSan / GCC
    runs-on: ubuntu-24.04

    env:
      ASAN_OPTIONS:  halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: ${{ steps.src.outputs.root }}
        # Sanitizer flags are passed directly through CMake variables.
        # -DLICENSE_SANITIZERS=OFF prevents CMakeLists from adding them again
        # (which would duplicate the flags and cause linker errors).
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: ${{ steps.src.outputs.root }}
        run: cmake --build build --parallel

      - name: Test under ASan + UBSan
        working-directory: ${{ steps.src.outputs.root }}
        run: ctest --test-dir build --output-on-failure --parallel 1

  # ────────────────────────────────────────────────────────────────────────────
  # AddressSanitizer + UndefinedBehaviourSanitizer — Clang
  # ────────────────────────────────────────────────────────────────────────────
  asan-ubsan-clang:
    name: ASan + UBSan / Clang
    runs-on: ubuntu-24.04

    env:
      ASAN_OPTIONS:  halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang llvm \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: ${{ steps.src.outputs.root }}
        run: cmake --build build --parallel

      - name: Test under ASan + UBSan
        working-directory: ${{ steps.src.outputs.root }}
        run: ctest --test-dir build --output-on-failure --parallel 1

  # ────────────────────────────────────────────────────────────────────────────
  # ThreadSanitizer — detect data races (Clang)
  # ────────────────────────────────────────────────────────────────────────────
  thread-sanitizer:
    name: ThreadSanitizer / Clang
    runs-on: ubuntu-24.04

    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: ${{ steps.src.outputs.root }}
        # TSan is incompatible with ASan — used alone.
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: ${{ steps.src.outputs.root }}
        run: cmake --build build --parallel

      - name: Test under TSan
        working-directory: ${{ steps.src.outputs.root }}
        run: ctest --test-dir build --output-on-failure --parallel 1

  # ────────────────────────────────────────────────────────────────────────────
  # Clang Static Analyzer (replaces MemorySanitizer)
  #
  # MSan requires ALL linked libraries — including OpenSSL — to be built with
  # MSan instrumentation. Using a system OpenSSL binary always produces massive
  # false-positive reports and will always exit non-zero. The Clang Static
  # Analyzer detects the same class of uninitialised-read bugs at compile time
  # without requiring instrumented libraries.
  # ────────────────────────────────────────────────────────────────────────────
  clang-static-analyzer:
    name: Clang Static Analyzer
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tools \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLICENSE_BUILD_TESTS=OFF \
            -DLICENSE_ENABLE_TPM=ON

      - name: Analyze with scan-build
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          scan-build \
            --status-bugs \
            -enable-checker alpha.security \
            -enable-checker alpha.core \
            -enable-checker alpha.cplusplus \
            --exclude build/_deps \
            cmake --build build --parallel \
            2>&1 | tee scan-build-report.txt

      - name: Upload scan-build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-report
          path: ${{ steps.src.outputs.root }}/scan-build-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # Valgrind Memcheck — detect heap errors and leaks at runtime
  # ────────────────────────────────────────────────────────────────────────────
  valgrind:
    name: Valgrind Memcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Detect source root
        id: src
        run: |
          if [ -d "$GITHUB_WORKSPACE/license-system" ]; then
            echo "root=$GITHUB_WORKSPACE/license-system" >> "$GITHUB_OUTPUT"
          else
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build valgrind \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: ${{ steps.src.outputs.root }}
        # RelWithDebInfo keeps debug symbols for readable Valgrind stack traces.
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: ${{ steps.src.outputs.root }}
        run: cmake --build build --parallel

      - name: Run tests under Valgrind
        working-directory: ${{ steps.src.outputs.root }}
        # Run the test binary directly — ctest's --overwrite MemoryCheckCommand
        # is a CDash/CTestCustom.cmake variable, not a valid ctest CLI flag.
        run: |
          valgrind \
            --tool=memcheck \
            --leak-check=full \
            --show-reachable=yes \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions="$GITHUB_WORKSPACE/.valgrind-suppressions" \
            ./build/tests/license_tests \
            2>&1 | tee valgrind-report.txt

      - name: Upload Valgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-report
          path: ${{ steps.src.outputs.root }}/valgrind-report.txt
