name: Sanitizers

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.github/workflows/sanitizers.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'license-system/**'
      - '.github/workflows/sanitizers.yml'
  schedule:
    # Nightly at 03:00 UTC on the default branch.
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # AddressSanitizer + UndefinedBehaviourSanitizer — GCC
  # ────────────────────────────────────────────────────────────────────────────
  asan-ubsan-gcc:
    name: ASan + UBSan / GCC
    runs-on: ubuntu-24.04

    env:
      ASAN_OPTIONS:  halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: license-system
        # Pass sanitizer flags directly through CMake variables.
        # Do NOT set -DLICENSE_SANITIZERS=ON here — that flag also adds the
        # same flags via add_compile/link_options, which would duplicate them.
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: license-system
        run: cmake --build build --parallel

      - name: Test under ASan + UBSan
        working-directory: license-system
        # Run single-threaded to avoid TSan false positives with ASan.
        run: ctest --test-dir build --output-on-failure --parallel 1

  # ────────────────────────────────────────────────────────────────────────────
  # AddressSanitizer + UndefinedBehaviourSanitizer — Clang
  # ────────────────────────────────────────────────────────────────────────────
  asan-ubsan-clang:
    name: ASan + UBSan / Clang
    runs-on: ubuntu-24.04

    env:
      ASAN_OPTIONS:  halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang llvm \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: license-system
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: license-system
        run: cmake --build build --parallel

      - name: Test under ASan + UBSan
        working-directory: license-system
        run: ctest --test-dir build --output-on-failure --parallel 1

  # ────────────────────────────────────────────────────────────────────────────
  # ThreadSanitizer — detect data races (Clang)
  # ────────────────────────────────────────────────────────────────────────────
  thread-sanitizer:
    name: ThreadSanitizer / Clang
    runs-on: ubuntu-24.04

    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: license-system
        # TSan is incompatible with ASan — use it alone.
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: license-system
        run: cmake --build build --parallel

      - name: Test under TSan
        working-directory: license-system
        run: ctest --test-dir build --output-on-failure --parallel 1

  # ────────────────────────────────────────────────────────────────────────────
  # Clang Static Analyzer — replaces MSan
  # (MSan requires ALL dependencies including OpenSSL to be MSan-instrumented,
  #  which is not feasible with system OpenSSL. clang-analyzer catches the same
  #  class of uninitialised-read bugs without that constraint.)
  # ────────────────────────────────────────────────────────────────────────────
  clang-static-analyzer:
    name: Clang Static Analyzer
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tools \
            libssl-dev libargon2-dev \
            libtss2-dev pkg-config

      - name: Configure
        working-directory: license-system
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLICENSE_BUILD_TESTS=OFF \
            -DLICENSE_ENABLE_TPM=ON

      - name: Analyze with scan-build
        working-directory: license-system
        run: |
          scan-build \
            --status-bugs \
            -enable-checker alpha.security \
            -enable-checker alpha.core \
            -enable-checker alpha.cplusplus \
            --exclude build/_deps \
            cmake --build build --parallel \
            2>&1 | tee scan-build-report.txt

      - name: Upload scan-build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-report
          path: license-system/scan-build-report.txt

  # ────────────────────────────────────────────────────────────────────────────
  # Valgrind Memcheck — detect heap errors and leaks
  # ────────────────────────────────────────────────────────────────────────────
  valgrind:
    name: Valgrind Memcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build valgrind \
            libssl-dev libargon2-dev pkg-config

      - name: Configure
        working-directory: license-system
        # RelWithDebInfo keeps debug symbols for readable stack traces.
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLICENSE_BUILD_TESTS=ON \
            -DLICENSE_ENABLE_TPM=OFF \
            -DLICENSE_SANITIZERS=OFF

      - name: Build
        working-directory: license-system
        run: cmake --build build --parallel

      - name: Run tests under Valgrind
        working-directory: license-system
        run: |
          valgrind \
            --tool=memcheck \
            --leak-check=full \
            --show-reachable=yes \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions="${GITHUB_WORKSPACE}/.valgrind-suppressions" \
            ./build/tests/license_tests \
            2>&1 | tee valgrind-report.txt

      - name: Upload Valgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-report
          path: license-system/valgrind-report.txt
